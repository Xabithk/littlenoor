<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Little Noor Dashboard - Welcome to your fashion design studio">
    <title>Dashboard - Little Noor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👗</text></svg>">
</head>
<body>

    <!-- Preloader -->
    <div id="preloader">
        <div class="loader"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="index.html" class="logo">Little <span>Noor</span></a>
            <div class="nav-overlay" id="navOverlay"></div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="projects.html" class="nav-link">Our Projects</a></li>
                <li><a href="index.html#services" class="nav-link">Services</a></li>
                <li><a href="measurements.html" class="nav-link">Measurements</a></li>
                <li><a href="index.html" class="nav-link" id="logoutBtn">Logout</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>
            <div class="nav-toggle" id="navToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Dashboard -->
    <section class="dashboard">
        <div class="container">
            <div class="dashboard-card fade-in">
                <div class="welcome-icon">
                    <i class="fas fa-tshirt"></i>
                </div>
                <h1>Welcome to <span>Little Noor!</span></h1>
                <p>Start designing your dream dress.</p>
                <p style="margin-bottom: 35px; font-size: 0.95rem;">We're excited to have you on board. Explore our services and let your creativity shine.</p>
                <div class="dashboard-links">
                    <a href="measurements.html" class="btn btn-primary">
                        <i class="fas fa-ruler-combined"></i> Take Measurements
                    </a>
                    <a href="projects.html" class="btn btn-gold-outline">
                        <i class="fas fa-images"></i> View Projects
                    </a>
                    <a href="contact.html" class="btn btn-dark">
                        <i class="fas fa-envelope"></i> Contact Us
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Scroll to Top -->
    <button class="scroll-top" id="scrollTop"><i class="fas fa-arrow-up"></i></button>

    <script src="js/script.js"></script>
</body>
</html>
